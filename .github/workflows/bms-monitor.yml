name: Monitor The Odyssey bookings

on:
  workflow_dispatch:
  schedule:
    # Every ten minutes, offset from the busy start of each hour.
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: bms-booking-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check BookMyShow and notify Telegram
        id: monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          SCRAPINGANT_BROWSER: ${{ vars.SCRAPINGANT_BROWSER }}
          SCRAPINGANT_PROXY_TYPE: ${{ vars.SCRAPINGANT_PROXY_TYPE }}
          SCRAPINGANT_PROXY_COUNTRY: ${{ vars.SCRAPINGANT_PROXY_COUNTRY }}
        run: python monitor.py --github-output "$GITHUB_OUTPUT" --soft-fail-bookmyshow-errors

      - name: Disable monitor after successful notification
        if: steps.monitor.outputs.notified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/bms-monitor.yml/disable"
